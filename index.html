<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Irregular Verbs Trainer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --text:#1c1d29; --muted:#6b6f85; --line:#e3e5ef;
  --accent:#5b5bf0; --accent2:#8a5cf6; --ok:#1fa96b; --bad:#e5484d; --warn:#f5a524;
  --chip:#eef0fb; --shadow:0 2px 10px rgba(30,30,80,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12131a;--card:#1c1e29;--text:#eceef7;--muted:#9a9db3;--line:#2c2f3e;--chip:#262a3a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:18px;margin:0 0 8px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s ease}
.bar.big{height:14px}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--chip);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600;text-align:center}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn:disabled{opacity:.45}
.level{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);margin-bottom:10px;box-shadow:var(--shadow);width:100%;text-align:left}
.level .num{width:42px;height:42px;border-radius:13px;background:var(--chip);display:grid;place-items:center;font-weight:700;flex:none}
.level.done .num{background:var(--ok);color:#fff}
.level.locked{opacity:.5}
.level .info{flex:1;min-width:0}
.level .t{font-weight:600}
.level .s{font-size:12px;color:var(--muted);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{position:relative;padding-left:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border-radius:16px;padding:14px 12px;text-align:left;box-shadow:var(--shadow)}
.mode .e{font-size:24px}
.mode .n{font-weight:600;margin-top:6px}
.mode .d{font-size:12px;color:var(--muted);margin-top:2px}
.mode.wide{grid-column:1/-1;display:flex;gap:12px;align-items:center}
.verbs{display:flex;flex-wrap:wrap;gap:6px}
.vchip{background:var(--chip);border-radius:10px;padding:6px 9px;font-size:14px}
.dots{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.rule{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.rule .p{font-size:20px;font-weight:700;letter-spacing:.5px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{width:34px;height:34px;border-radius:10px;background:var(--chip);font-size:18px;flex:none}
.top .bar{flex:1}
.prompt{text-align:center;padding:22px 10px}
.prompt .emo{font-size:46px}
.prompt .big{font-size:34px;font-weight:800;margin:6px 0}
.prompt .q{font-size:15px;color:var(--muted)}
.prompt .sent{font-size:21px;line-height:1.45;font-weight:500}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:600;box-shadow:var(--shadow)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:20px;text-align:center;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--accent)}
.inp.ok{border-color:var(--ok)} .inp.bad{border-color:var(--bad)}
.lbl{font-size:12px;color:var(--muted);margin:0 0 4px 4px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--card);box-shadow:0 -6px 24px rgba(0,0,0,.12);transform:translateY(110%);transition:transform .25s ease;z-index:10}
.fb.show{transform:none}
.fb .in{max-width:520px;margin:0 auto}
.fb .h{font-weight:700;font-size:18px;margin-bottom:6px}
.fb.good .h{color:var(--ok)} .fb.wrong .h{color:var(--bad)}
.forms{font-size:20px;font-weight:700;margin:4px 0}
.forms .sp{color:var(--muted);font-weight:400;margin:0 6px}
.say{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--chip);font-size:15px;vertical-align:middle;margin-left:4px}
.coll{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.coll span{background:var(--chip);padding:5px 9px;border-radius:9px;font-size:14px}
/* flashcard */
.flip{perspective:1000px;height:330px;margin:10px 0 16px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .emo{font-size:58px}
.face .w{font-size:36px;font-weight:800;margin:8px 0 4px}
.face .ipa{color:var(--muted)}
.face .def{margin-top:10px;font-style:italic;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:8px 0}
.grid3 div{background:var(--chip);border-radius:12px;padding:10px 4px}
.grid3 small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.grid3 b{font-size:17px;display:block}
.grid3 i{font-style:normal;font-size:12px;color:var(--muted)}
.note{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0;color:var(--text)}
select.inp{font-size:15px;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}
/* anagram */
.slots{display:flex;justify-content:center;gap:6px;min-height:52px;margin:10px 0;flex-wrap:wrap}
.slot{width:40px;height:48px;border-radius:10px;border-bottom:3px solid var(--accent);display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--chip)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tile{width:46px;height:50px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:2px solid var(--line);font-size:22px;font-weight:700}
.tile.used{opacity:.2;pointer-events:none}
/* blitz */
.timer{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{padding:20px;border-radius:16px;font-size:20px;font-weight:700;color:#fff}
.tf .no{background:var(--bad)} .tf .yes{background:var(--ok)}
.trip{font-size:28px;font-weight:800;text-align:center;padding:40px 0}
.flash-ok{animation:fo .35s} .flash-bad{animation:fbd .35s}
@keyframes fo{50%{transform:scale(1.04);color:var(--ok)}}
@keyframes fbd{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* results */
.res{text-align:center;padding:20px 0}
.res .score{font-size:54px;font-weight:800}
.mist{text-align:left}
.mist div{padding:8px 0;border-bottom:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.ex{font-size:15px;margin:6px 0;line-height:1.4}
.ex b{color:var(--accent)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.link{color:var(--accent);font-weight:600}
.spacer{height:110px}
</style>
</head>

  let h=`<div class="top"><button class="x" onclick="go({s:'home'})">←</button><div style="flex:1"><div class="small muted">Уровень ${i+1}</div><b>${lv.name}</b></div><span class="pct">${pc}%</span></div>
  <div class="rule"><div class="small" style="opacity:.85">Модель</div><div class="p">${lv.pat}</div><div style="opacity:.9">${lv.ex}</div>
  <div class="bar" style="margin-top:10px;background:rgba(255,255,255,.3)"><i style="width:${pc}%;background:#fff"></i></div></div>
  <div class="card"><div class="row between" style="margin-bottom:8px"><b>Глаголы</b><span class="small muted">нажми, чтобы открыть</span></div><div class="verbs">`;
  lv.verbs.forEach(v=>h+=`<button class="vchip" onclick="verbSheet('${v.v1}')">${v.emo} ${v.v1}${dots(v)}</button>`);
  h+=`</div></div><div class="modes">`;
  Object.entries(MODES).forEach(([k,m])=>{
    const wide=k==="mix";
    h+=`<button class="mode ${wide?"wide":""}" onclick="${k==="blitz"?`startBlitz(${i})`:`startSession('${k}',${i})`}">${wide?`<span class="e">${m.e}</span><span><div class="n">${m.n}</div><div class="d">${m.d}</div></span>`:`<div class="e">${m.e}</div><div class="n">${m.n}</div><div class="d">${m.d}</div>`}</button>`;
  });
  h+=`</div>`;
  app.innerHTML=h;
}
function verbSheet(w){
  const v=BY[w];haptic();
  const bg=document.createElement("div");bg.className="sheet-bg";bg.onclick=e=>{if(e.target===bg)bg.remove()};
  const hl=(s,a)=>esc(s).replace("___",`<b>${a}</b>`);
  bg.innerHTML=`<div class="sheet"><div style="text-align:center"><div style="font-size:50px">${v.emo}</div>
  <div class="forms" style="font-size:24px">${forms(v)}</div><div class="muted">${ipaLine(v)} <button class="say" onclick="say('${formsTxt(v)}')">🔊</button></div>${soundNote(v)}
  <p class="muted"><i>${esc(v.def)}</i></p></div>
  <b>Collocations</b><div class="coll">${v.col.map(c=>`<span onclick="say('${c.replace(/'/g,"\\'")}')">${esc(c)}</span>`).join("")}</div>
  <b>Examples</b><div class="ex">${hl(v.pastS,(v.pastAns||v.v2)[0])}</div>${v.perfS?`<div class="ex">${hl(v.perfS,v.v3[0])}</div>`:""}
  <div class="row small muted" style="margin-top:10px">Знание: ${dots(v)}</div>
  <button class="btn ghost" style="margin-top:14px" onclick="this.closest('.sheet-bg').remove()">Закрыть</button></div>`;
  document.body.appendChild(bg);
}
function settings(){
  setBack(()=>go({s:"home"}));
  const vs=enVoices().sort((a,b)=>a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
  const cur=voice?voice.name:"";
  const flag=l=>/GB/i.test(l)?"🇬🇧":/US/i.test(l)?"🇺🇸":/AU/i.test(l)?"🇦🇺":/IE/i.test(l)?"🇮🇪":/IN/i.test(l)?"🇮🇳":/CA/i.test(l)?"🇨🇦":/ZA/i.test(l)?"🇿🇦":"🌐";
  app.innerHTML=`<div class="top"><button class="x" onclick="go({s:'home'})">←</button><b style="flex:1">Настройки</b></div>
  <div class="card"><h2>🔊 Озвучка</h2>
    ${vs.length?`<div class="lbl">Голос (${vs.length} англ. голосов на этом устройстве)</div>
    <select class="inp" id="vsel">${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${flag(v.lang)} ${esc(v.name.replace(/^Microsoft |^Google /,""))} · ${v.lang}</option>`).join("")}</select>
    <div class="row" style="gap:8px;margin-bottom:6px"><button class="vchip" onclick="voiceStep(-1)">◀ пред.</button><button class="vchip" onclick="voiceStep(1)">след. ▶</button><button class="vchip" onclick="S.voice='';save();pickVoice();settings()">авто</button></div>`
    :`<p class="muted small">Голоса ещё загружаются или на устройстве нет английских голосов. Нажми «Проверить» — список обновится.</p>`}
    <div class="lbl" style="margin-top:10px">Скорость: <b id="rv">${S.rate}</b></div>
    <input type="range" min="0.5" max="1.2" step="0.1" value="${S.rate}" oninput="S.rate=+this.value;$('#rv').textContent=this.value;save()">
    <div class="lbl" style="margin-top:6px">Высота голоса: <b id="pv">${S.pitch||1}</b></div>
    <input type="range" min="0.6" max="1.4" step="0.1" value="${S.pitch||1}" oninput="S.pitch=+this.value;$('#pv').textContent=this.value;save()">
    <button class="btn" style="margin-top:12px" onclick="pickVoice();say('read, red, red. I read a book yesterday.')">▶ Проверить голос</button>
    <p class="small muted">Голоса берутся из системы: на телефоне и компьютере набор разный. Самые живые обычно с пометкой Natural, Online или Google.</p>
  </div>
  <div class="card"><div class="toggle"><span>Открыть все уровни</span><button class="sw ${S.unlockAll?"on":""}" onclick="S.unlockAll=!S.unlockAll;save();settings()"></button></div></div>
  <div class="card small muted">Прогресс уровня = сумма «знаний» по глаголам (0–5 за каждый). Верный ответ +1, ошибка −1. Карточки дают максимум 2 из 5 — дальше нужно вспоминать самому.</div>
  <button class="btn ghost" onclick="resetAsk(this)">Сбросить прогресс</button>`;
  const sel=$("#vsel");if(sel)sel.onchange=()=>{S.voice=sel.value;save();pickVoice();say("Hello! go, went, gone.")};
}
function voiceStep(d){const sel=$("#vsel");if(!sel)return;sel.selectedIndex=(sel.selectedIndex+d+sel.options.length)%sel.options.length;sel.onchange()}
function resetAsk(b){if(b.dataset.c){S.m={};S.xp=0;S.streak=0;S.best=0;save();go({s:"home"})}else{b.dataset.c=1;b.textContent="Нажми ещё раз, чтобы сбросить";b.style.color="var(--bad)"}}

/* ============ SESSION ENGINE ============ */
let SES=null;
function startReview(){
  const pool=VERBS.filter(v=>unlocked(v.lv));
  const weak=pool.slice().sort((a,b)=>sc(a)-sc(b)+Math.random()*1.5-.75).slice(0,10);
  runSession("mix",weak,null);
}
function startSession(mode,li){
  const pool=li===null?VERBS.filter(v=>unlocked(v.lv)):LEVELS[li].verbs;
  const n=mode==="cards"?Math.min(pool.length,12):10;
  let vs=mode==="cards"?shuf(pool).slice(0,n):pickVerbs(shuf(pool),n);
  runSession(mode,vs,li);
}
function makeQ(mode,v){
  if(mode==="mix")mode=rnd(["form","colloc","context","context_choice","type2","listen","anagram"]);
  if(mode==="context"&&!v.perfS&&!v.pastS)mode="form";
  if(mode==="listen"&&!canSpeak)mode="form";
  return GEN[mode](v);
}
function runSession(mode,vs,li){
  touchStreak();
  const before=li===null?allPct():lvlPct(LEVELS[li]);
  SES={mode,li,queue:vs.map(v=>mode==="cards"?{kind:"flash",v}:makeQ(mode,v)),i:0,ok:0,total:vs.length,mist:[],xp:0,before,retried:new Set()};
  setBack(()=>endSession(true));
  renderQ();
}
function topBar(){const p=Math.round(SES.i/SES.queue.length*100);
  return `<div class="top"><button class="x" onclick="endSession(true)">✕</button><div class="bar"><i style="width:${p}%"></i></div><span class="small muted">${Math.min(SES.i+1,SES.queue.length)}/${SES.queue.length}</span></div>`}
function renderQ(){
  if(SES.i>=SES.queue.length)return endSession(false);
  const q=SES.queue[SES.i];
  if(q.kind==="flash")return renderFlash(q);
  let h=topBar()+`<div class="prompt">${q.html}</div>`;
  if(q.kind==="choice"){h+=`<div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(q.labels?q.labels[o]:o)}</button>`).join("")}</div>`}
  if(q.kind==="type"){h+=`<input class="inp" id="a1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…"><button class="btn" id="chk">Проверить</button>`}
  if(q.kind==="type2"){h+=`<div class="lbl">Past Simple (V2)</div><input class="inp" id="a1" autocomplete="off" autocapitalize="off" spellcheck="false">
    ${q.v.v3?`<div class="lbl">Past Participle (V3)</div><input class="inp" id="a2" autocomplete="off" autocapitalize="off" spellcheck="false">`:""}<button class="btn" id="chk">Проверить</button>`}
  if(q.kind==="anagram"){h+=`<div class="slots" id="slots">${q.word.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
    <div class="tiles">${q.letters.map((l,k)=>`<button class="tile" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="vchip" id="undo">⌫ стереть</button></div>`}
  h+=`<div class="spacer"></div>`;
  app.innerHTML=h;
  if(q.speak)setTimeout(()=>say(q.speak),250);
  if(q.kind==="choice")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(SES.lock)return;SES.lock=1;const o=b.dataset.o,good=q.ans.map(norm).includes(norm(o));
    b.classList.add(good?"ok":"bad");
    if(!good)app.querySelectorAll(".opt").forEach(x=>{if(q.ans.map(norm).includes(norm(x.dataset.o)))x.classList.add("ok")});
    answer(q,good);
  });
  if(q.kind==="type"||q.kind==="type2"){
    const a1=$("#a1"),a2=$("#a2");a1.focus();
    const check=()=>{if(SES.lock)return;
      let good;
      if(q.kind==="type"){good=q.ans.map(norm).includes(norm(a1.value));a1.classList.add(good?"ok":"bad")}
      else{const g1=q.v.v2.map(norm).includes(norm(a1.value)),g2=!a2||q.v.v3.map(norm).includes(norm(a2.value));
        a1.classList.add(g1?"ok":"bad");a2&&a2.classList.add(g2?"ok":"bad");good=g1&&g2}
      SES.lock=1;answer(q,good)};
    $("#chk").onclick=check;
    [a1,a2].forEach((el,k)=>el&&(el.onkeydown=e=>{if(e.key==="Enter"){if(k===0&&a2&&!a2.value)a2.focus();else check()}}));
  }
  if(q.kind==="anagram"){
    let built=[];const slots=[...app.querySelectorAll(".slot")];
    const draw=()=>slots.forEach((s,k)=>s.textContent=built[k]?built[k].l:"");
    app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(SES.lock)return;haptic();t.classList.add("used");built.push({l:t.textContent,t});draw();
      if(built.length===q.word.length){const w=built.map(b=>b.l).join(""),good=w===q.word;SES.lock=1;
        $("#slots").classList.add(good?"flash-ok":"flash-bad");answer(q,good)}});
    $("#undo").onclick=()=>{if(SES.lock)return;const b=built.pop();if(b){b.t.classList.remove("used");draw()}};
  }
}
function answer(q,good){
  const v=q.v;haptic(good?"ok":"bad");
  if(good){SES.ok++;SES.xp+=10;setSc(v,+1)}
  else{setSc(v,-1);SES.mist.push(v);
    if(!SES.retried.has(v.v1)&&SES.mode!=="odd"){SES.retried.add(v.v1);SES.queue.push(makeQ(SES.mode==="mix"?"mix":SES.mode,v))}}
  save();
  if(good&&!q.speak)say(q.kind==="choice"&&q.ans[0]===v.v1&&q.extra&&!q.labels?q.extra:formsTxt(v));
  const fb=document.createElement("div");fb.className="fb "+(good?"good":"wrong");
  fb.innerHTML=`<div class="in"><div class="h">${good?rnd(["Great!","Correct!","Well done!","Exactly!"]):"Not quite"}</div>
    <div class="forms">${v.emo} ${forms(v)} <button class="say" onclick="say('${formsTxt(v)}')">🔊</button></div><div class="muted small">${ipaLine(v)}</div>${soundNote(v)}
    ${q.extra?`<div class="muted small" style="margin:4px 0">${esc(q.extra)}</div>`:""}
    <div class="coll">${v.col.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
    <button class="btn" id="nx" style="margin-top:8px">Дальше</button></div>`;
  document.body.appendChild(fb);requestAnimationFrame(()=>fb.classList.add("show"));
  const next=()=>{fb.remove();SES.lock=0;SES.i++;renderQ()};
  fb.querySelector("#nx").onclick=next;
  setTimeout(()=>{const n=fb.querySelector("#nx");n&&n.focus()},50);
}
function renderFlash(q){
  const v=q.v;
  app.innerHTML=topBar()+`<div class="flip" id="fl"><div class="inner">
    <div class="face"><div class="emo">${v.emo}</div><div class="w">${v.v1}</div><div class="ipa">/${v.ipa}/</div><div class="def">${esc(v.def)}</div>
      <div class="small muted" style="margin-top:22px">Вспомни V2 и V3 — потом нажми на карточку</div></div>
    <div class="face back"><div class="emo" style="font-size:40px">${v.emo}</div>
      <div class="grid3"><div><small>V1</small><b>${v.v1}</b><i>/${v.ipas[0]}/</i></div><div><small>V2</small><b>${v.v2.join("/")}</b><i>/${v.ipas[1]}/</i></div><div><small>V3</small><b>${v.v3?v.v3.join("/"):"—"}</b><i>${v.v3?"/"+v.ipas[2]+"/":""}</i></div></div>${soundNote(v)}
      <div class="coll" style="justify-content:center">${v.col.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
      <div class="ex small">${esc(v.pastS).replace("___",`<b>${(v.pastAns||v.v2)[0]}</b>`)}</div></div>
  </div></div>
  <div class="row" id="fbtn" style="visibility:hidden"><button class="btn ghost" id="no">🔁 Ещё учу</button><button class="btn" id="yes">✅ Знаю</button></div>`;
  const fl=$("#fl");
  fl.onclick=()=>{if(!fl.classList.contains("on")){fl.classList.add("on");haptic();say(formsTxt(v));$("#fbtn").style.visibility="visible"}else say(formsTxt(v))};
  $("#yes").onclick=()=>{SES.ok++;SES.xp+=5;setSc(v,sc(v)<2?1:0,5);save();SES.i++;renderQ()};
  $("#no").onclick=()=>{SES.mist.push(v);if(!SES.retried.has(v.v1)){SES.retried.add(v.v1);SES.queue.push({kind:"flash",v})}SES.i++;renderQ()};
}
function endSession(aborted){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  if(!SES)return go({s:"home"});
  S.xp+=SES.xp;if(!aborted)S.sessions++;save();
  const li=SES.li,after=li===null?allPct():lvlPct(LEVELS[li]);
  if(aborted&&SES.i===0){const l=li;SES=null;return go(l===null?{s:"home"}:{s:"level",i:l})}
  const answered=SES.mode==="cards"?SES.queue.length:SES.i;
  const mist=[...new Set(SES.mist)];
  setBack(()=>go(li===null?{s:"home"}:{s:"level",i:li}));
  app.innerHTML=`<div class="res"><div style="font-size:50px">${SES.ok>=answered*0.8?"🎉":SES.ok>=answered*0.5?"💪":"📚"}</div>
    <div class="score">${SES.ok}/${answered}</div><div class="muted">+${SES.xp} XP</div></div>
    <div class="card"><div class="row between"><b>${li===null?"Общий прогресс":LEVELS[li].name}</b><span class="pct" id="pp">${SES.before}%</span></div>
      <div class="bar big" style="margin-top:8px"><i id="pb" style="width:${SES.before}%"></i></div>
      ${li!==null&&after>=50&&SES.before<50&&LEVELS[li+1]?`<p style="margin:10px 0 0">🔓 Открыт уровень «${LEVELS[li+1].name}»!</p>`:""}</div>
    ${mist.length?`<div class="card mist"><b>Повтори</b>${mist.map(v=>`<div onclick="verbSheet('${v.v1}')">${v.emo} ${forms(v)}</div>`).join("")}</div>`:""}
    <div class="row"><button class="btn ghost" onclick="go(${li===null?"{s:'home'}":`{s:'level',i:${li}}`})">Назад</button>
    <button class="btn" onclick="${SES.mode==="mix"&&li===null?"startReview()":`startSession('${SES.mode}',${li})`}">Ещё раз</button></div>`;
  setTimeout(()=>{const b=$("#pb");if(b){b.style.width=after+"%";$("#pp").textContent=after+"%"}},200);
}

/* ============ BLITZ ============ */
function startBlitz(li){
  touchStreak();
  const pool=(li===null?VERBS.filter(v=>unlocked(v.lv)):LEVELS[li].verbs).filter(v=>v.v3);
  let t=60,score=0,streak=0,cur,timer,done=false;
  setBack(()=>{clearInterval(timer);go(li===null?{s:"home"}:{s:"level",i:li})});
  const next=()=>{
    const v=rnd(pool),truth=Math.random()<.5;let v2=v.v2[0],v3=v.v3[0];
    if(!truth){if(Math.random()<.5)v2=fakes(v,"v2")[0];else v3=fakes(v,"v3")[0]}
    cur={v,truth};$("#trip").innerHTML=`${v.v1} – ${esc(v2)} – ${esc(v3)}`;
  };
  app.innerHTML=`<div class="top"><button class="x" id="bx">✕</button><div class="bar"><i id="tb" style="width:100%;transition:width 1s linear"></i></div><span class="timer" id="tt">60</span></div>
    <div class="row between"><span class="muted">Счёт: <b id="bs">0</b></span><span class="muted">Серия: <b id="bk">0</b></span></div>
    <div class="card trip" id="trip"></div><div class="tf"><button class="no" id="bn">✗ Неверно</button><button class="yes" id="by">✓ Верно</button></div>
    <p class="small muted" style="text-align:center">Верная ли тройка форм?</p>`;
  const ans=yes=>{if(done)return;const good=yes===cur.truth;const tr=$("#trip");tr.classList.remove("flash-ok","flash-bad");void tr.offsetWidth;tr.classList.add(good?"flash-ok":"flash-bad");haptic(good?"ok":"bad");
    if(good){streak++;score+=1+Math.floor(streak/5);setSc(cur.v,+1)}else{streak=0;setSc(cur.v,-1);t=Math.max(0,t-3)}
    $("#bs").textContent=score;$("#bk").textContent=streak;next()};
  $("#by").onclick=()=>ans(true);$("#bn").onclick=()=>ans(false);
  $("#bx").onclick=()=>{clearInterval(timer);save();go(li===null?{s:"home"}:{s:"level",i:li})};
  next();
  timer=setInterval(()=>{t--;$("#tt").textContent=t;$("#tb").style.width=(t/60*100)+"%";
    if(t<=0){clearInterval(timer);done=true;const rec=score>S.best;if(rec)S.best=score;S.xp+=score*5;save();
      app.innerHTML=`<div class="res"><div style="font-size:50px">${rec?"🏆":"⚡"}</div><div class="score">${score}</div>
      <div class="muted">${rec?"Новый рекорд!":"Рекорд: "+S.best} · +${score*5} XP</div></div>
      <div class="row"><button class="btn ghost" onclick="go(${li===null?"{s:'home'}":`{s:'level',i:${li}}`})">Назад</button><button class="btn" onclick="startBlitz(${li})">Ещё раз</button></div>`}},1000);
}

/* ============ INIT ============ */
function applyTgTheme(){try{if(!tg)return;tg.ready();tg.expand();const p=tg.themeParams||{},r=document.documentElement.style;
  if(p.bg_color){r.setProperty("--bg",p.secondary_bg_color||p.bg_color);r.setProperty("--card",p.bg_color)}
  if(p.text_color)r.setProperty("--text",p.text_color);if(p.hint_color)r.setProperty("--muted",p.hint_color);
  if(p.button_color)r.setProperty("--accent",p.button_color);
  if(tg.colorScheme==="dark"){r.setProperty("--chip","rgba(255,255,255,.07)");r.setProperty("--line","rgba(255,255,255,.12)")}}catch(e){}}
load();applyTgTheme();cloudLoad();route();
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
</script>
